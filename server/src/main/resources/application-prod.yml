server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    host: ${DB_HOST}
    port: ${DB_PORT:5432}
    database: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${spring.datasource.host}:${spring.datasource.port}/${spring.datasource.database}

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

database:
  loader:
    enabled: ${DATABASE_LOADER_ENABLED:false}

properties:
  clientHost: ${CLIENT_HOST}
  jwtSecretKey: ${JWT_SECRET_KEY}
  rutaImagenes: ${IMAGES_PATH:./uploads/images/}
  ticketmaster:
    enabled: ${TICKETMASTER_ENABLED:false}
    apiKey: ${TICKETMASTER_API_KEY:}
  ai:
    searchParser:
      enabled: ${GEMINI_ENABLED:false}
      apiKey: ${GEMINI_API_KEY:}
