name: fios_entrega

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fios}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fios-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./database/fios_database.sql:/docker-entrypoint-initdb.d/01-fios_database.sql:ro
    restart: unless-stopped

  server:
    build:
      context: ./server
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fios}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fios-local-password}
      CLIENT_HOST: ${CLIENT_HOST:-http://localhost:1234}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-una-clave-local-para-entrega-suficientemente-larga}
      IMAGES_PATH: ${IMAGES_PATH:-/app/uploads/images}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      DATABASE_LOADER_ENABLED: "false"
      TICKETMASTER_ENABLED: ${TICKETMASTER_ENABLED:-false}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - server_uploads:/app/uploads/images
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-/api}
    depends_on:
      - server
    ports:
      - "1234:80"
    restart: unless-stopped

volumes:
  database_data:
  server_uploads:
